<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/biblia/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblia PWA - Aplicación de la Biblia</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Una aplicación web progresiva para leer la Biblia, inspirada en YouVersion" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Biblia PWA" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/biblia/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/biblia/icon-192x192.png" />
    <script type="module" crossorigin src="/biblia/assets/index-DGV1Lkp8.js"></script>
    <link rel="stylesheet" crossorigin href="/biblia/assets/index-CgH5slAF.css">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
